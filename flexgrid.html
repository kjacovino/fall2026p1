<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>FlexGrid</title>
        <style type="text/css">
            #flexbox-demo {
                display: flex;
                gap: 1rem;
                background-color:red;
            }
            .flex-item {
                background-color: aqua;
                padding: 1rem;
                flex-grow: 1;
            }
            
            #grid-demo {
                display: grid;
                gap: 1rem;
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }
            .grid-item {
                
            }
            .grid-item img {
                width: 100%;
                height:100%;
                object-fit: cover;
                display: block;
            }
        </style>
    </head>
    <body>
        <section id="flexbox-demo">
            <div class="flex-item">
                <h3>Callout 1</h3>
                <p>Lorem ipsum.</p>
            </div>
            <div class="flex-item two">
                <h3>Callout 2</h3>
                <p>Lorem ipsum.</p>
            </div>
            <div class="flex-item">
                <h3>Callout 3</h3>
                <p>Lorem ipsum.</p>
            </div>
        </section>
        <section id="grid-demo">
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
            <div class="grid-item"><img src="movie.webp" /></div>
        </section>
    
    </body>
</html>
