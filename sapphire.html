<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style type="text/css">
            h1 {
                color:crimson;
            }
            section#hero {
                background-color:blueviolet;
                padding: 1rem;
            }
            #features {
                display:flex;
                gap: 1rem;
                padding: 1rem;
                background-color:aqua;
            }
            .callout {
                background-color:coral;
                width:32%;
                padding:1rem;
                text-align: center;
            }
            #grid {
              display: grid;
              grid-template-columns: repeat(4, 1fr);
              grid-template-rows: repeat(5, 1fr);
              gap: 8px;
            }

            .item {
              overflow: hidden;
              min-width: 0;   /* prevents grid blowout */
              min-height: 0;  /* prevents grid blowout */
            }

            .item img {
              width: 100%;
              height: 100%;
              object-fit: cover;
              display: block;
            }
        </style>
    </head>
    <body>
        <div id="wrapper">
            <header>
                <h1>My website</h1>
            </header>
            <section id="hero">
                <h2>This is my first <a href="https://google.com" target="_blank">website</a>.</h2>
            </section>
            <section id="features">
                <div class="callout">
                    <h3>Callout 1</h3>
                    <p>Lorem ipsum.</p>
                </div>
                <div class="callout">
                    <h3>Callout 2</h3>
                    <p>Lorem ipsum.</p>
                </div>
                <div class="callout">
                    <h3>Callout 3</h3>
                    <p>Lorem ipsum.</p>
                </div>
            </section>
            <section id="grid">
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
                <div class="item"><img src="movie.webp" /></div>
            </section>
            <footer>
             <p>Copyright 2026.</p>
            </footer>
        </div>    
    </body>
</html>
